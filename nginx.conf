# Production nginx configuration for SSB Practice site.
#
# Serves the Vite-built static frontend from /var/www/ssb-practice/dist
# and proxies /api/* to the Python backend on 127.0.0.1:8787.
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/ssb-practice
#   sudo ln -s /etc/nginx/sites-available/ssb-practice /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # <-- change to your actual domain

    root /var/www/ssb-practice/dist;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # --- Gzip compression ---
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;

    # --- Static assets: cache aggressively ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API: proxy to Python backend ---
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- SPA fallback: serve index.html for all other routes ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
